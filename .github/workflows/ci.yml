name: News2 Qsofa Early Warning CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic pytest

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: ci-test-audit-key-news2-qsofa-2026
      run: |
        pytest -v

    - name: Audit-chain smoke test
      env:
        AUDIT_SECRET_KEY: ci-test-audit-key-news2-qsofa-2026
      run: |
        python -c "
        from agents.base import PHIGuard, AuditTrail, SecurityException
        audit = AuditTrail(secret_key='ci-smoke-test-only')
        audit.log('test', 'worker', 'TEST', {'status': 'OK'})
        assert audit.verify_integrity()
        audit.logs[0]['actor'] = 'altered'
        assert not audit.verify_integrity()
        try:
            PHIGuard.assert_no_phi('Patient MRN-994827')
        except SecurityException:
            pass
        else:
            raise AssertionError('Expected pattern-based identifier rejection')
        print('Audit signature and identifier-pattern smoke checks passed')

        "

    - name: Python syntax and dependency consistency
      run: |
        python -m compileall -q .
        python -m pip check

    - name: Browser scoring and CSV regression tests
      run: |
        node --version
        node --check web/scoring.js
        node --test web/scoring.test.cjs
        python - <<'PY'
        from pathlib import Path
        import re
        html = Path("web/index.html").read_text(encoding="utf-8")
        scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
        assert len(scripts) == 2 and scripts[-1].strip(), "Expected browser script"
        Path("/tmp/early-warning-inline.js").write_text(scripts[-1], encoding="utf-8")
        PY
        node --check /tmp/early-warning-inline.js
